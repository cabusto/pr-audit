name: PR Audit

on:
  pull_request_target:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pr-audit
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Fetch PR head
        run: git fetch --no-tags --depth=1 origin pull/${{ github.event.pull_request.number }}/head:pr-head

      - name: Run audit
        run: pr-audit analyze --base ${{ github.event.pull_request.base.sha }} --head pr-head --output out/

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-audit-comment -->';
            const body = `${marker}\n\n${fs.readFileSync('out/audit.md', 'utf8')}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
