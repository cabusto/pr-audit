name: PR Audit

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened

jobs:
  analyze:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pr-audit
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Fetch PR head
        run: git fetch --no-tags origin pull/${{ github.event.pull_request.number }}/head:pr-head

      - name: Run audit
        run: pr-audit analyze --base ${{ github.event.pull_request.base.sha }} --head pr-head --output out/

      - name: Write audit summary
        run: cat out/audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save PR number
        run: echo "${{ github.event.pull_request.number }}" > out/pr_number.txt

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-audit
          path: out/
