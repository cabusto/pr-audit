name: PR Audit

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened

jobs:
  analyze:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout base commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pr-audit
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Fetch PR head
        run: git fetch --no-tags origin pull/${{ github.event.pull_request.number }}/head:pr-head

      - name: Run audit
        run: pr-audit analyze --base ${{ github.event.pull_request.base.sha }} --head pr-head --output out/

      - name: Write audit summary
        run: cat out/audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-audit
          path: out/
