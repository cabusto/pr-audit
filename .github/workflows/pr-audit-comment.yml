name: PR Audit Comment

on:
  workflow_run:
    workflows:
      - PR Audit
    types:
      - completed

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Check for audit artifact
        id: artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const artifact = artifacts.find((item) => item.name === 'pr-audit');
            core.setOutput('found', artifact ? 'true' : 'false');

      - name: Download audit artifact
        if: steps.artifact.outputs.found == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-audit
          path: out/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Comment on PR
        if: steps.artifact.outputs.found == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-audit-comment -->';
            // audit.md comes from the PR's own run, so a fork controls it. Keep only plain-word headings and
            // re-fence everything else, so links, images and @mentions in it never render.
            const lines = fs.readFileSync('out/audit.md', 'utf8').slice(0, 60000).split('\n');
            const out = [marker, ''];
            let chunk = [];
            const flush = () => {
              while (chunk.length && !chunk[0].trim()) chunk.shift();
              while (chunk.length && !chunk[chunk.length - 1].trim()) chunk.pop();
              if (!chunk.length) return;
              const runs = chunk.flatMap((line) => line.match(/`+/g) || []);
              const fence = '`'.repeat(Math.max(3, ...runs.map((run) => run.length + 1)));
              out.push(`${fence}text`, ...chunk, fence, '');
              chunk = [];
            };
            for (const line of lines) {
              if (/^#{1,2} [A-Za-z ]+$/.test(line)) {
                flush();
                out.push(line);
              } else if (!/^`{3,}(text)?$/.test(line)) {
                chunk.push(line);
              }
            }
            flush();
            const body = out.join('\n');
            // workflow_run.pull_requests is empty for fork PRs, so look the PR up by head SHA and repo.
            const run = context.payload.workflow_run;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const matches = pulls.filter(
              (pull) => pull.head.sha === run.head_sha && pull.head.repo?.full_name === run.head_repository?.full_name,
            );
            if (matches.length !== 1) {
              core.warning('Skipping PR comment: could not identify the PR for this workflow run.');
              return;
            }
            const issueNumber = matches[0].number;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              const existing = comments.find((comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body,
                });
              }
            } catch (error) {
              core.warning(`Skipping PR comment: ${error.message}`);
            }
