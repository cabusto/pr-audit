[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-audit"
version = "0.1.0"
description = "Deterministic pull-request observability for Python repositories"
readme = "pr-audit-sprint-1-implementation-brief.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pr-audit = "pr_audit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
